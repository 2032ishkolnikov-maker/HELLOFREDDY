<!DOCTYPE html>
<html>
<head>
  <title>FazLogin</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle, #111 40%, #000 100%);
      color: white;
      font-family: "Courier New", monospace;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Scanline effect */
    body::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
    }

    .container {
      background: rgba(0, 0, 0, 0.8);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 20px red;
      text-align: center;
      width: 350px;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-size: 40px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px red, 0 0 20px red;
      animation: flicker 2s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .subtitle {
      margin-bottom: 20px;
      font-size: 16px;
      color: #ccc;
    }

    input[type="text"] {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      background: black;
      border: 2px solid red;
      color: white;
      border-radius: 5px;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 10px red;
    }

    input[type="submit"] {
      margin-top: 15px;
      padding: 15px 30px;
      font-size: 18px;
      background: black;
      color: white;
      border: 2px solid red;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    input[type="submit"]:hover {
      background: red;
      color: black;
      box-shadow: 0 0 20px red;
      transform: scale(1.05);
    }

    .characters {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="title">FAZLOGIN</div>
    <div class="subtitle">Enter credentials to access system</div>

    <form action="page1.html">
      <input type="text" name="fname" placeholder="First Name" required><br>
      <input type="text" name="lname" placeholder="Last Name" required><br>
      <input type="submit" value="LOGIN">
    </form>

    <div class="characters">
      FOXY • BONNIE • CHICA • FREDDY
    </div>
  </div>

<script src="music.js"></script>
</body>
</html>
