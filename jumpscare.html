
<!DOCTYPE html>
<html>
<head>
  <title>Loading Assets...</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #050505;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      /* Bright Red Text */
      color: #ff0000; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Subtle red glow to the whole screen */
      text-shadow: 0 0 5px #ff0000;
    }

    #loader-ui {
      width: 300px;
      text-align: center;
    }

    .progress-bg {
      width: 100%;
      height: 6px;
      background: #200000;
      margin-top: 10px;
      border: 1px solid #660000;
      box-shadow: 0 0 10px #330000;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      /* Bright Neon Red */
      background: #ff0000;
      transition: width 0.05s linear;
      /* Intense Glow Effect */
      box-shadow: 0 0 15px #ff0000, 0 0 5px #ffffff;
    }

    #status-text {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="loader-ui">
  <div id="status-text">Initializing Systems...</div>
  <div class="progress-bg">
    <div id="progress-bar"></div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const progressBar = document.getElementById("progress-bar");
  const statusText = document.getElementById("status-text");

  const loadingMessages = [
    "Loading Textures...",
    "Optimizing Shaders...",
    "Syncing Assets...",
    "Connecting...",
    "System Ready."
  ];

  let progress = 0;
  let messageIndex = 0;

  const interval = setInterval(() => {
    progress += Math.random() * 10; 
    
    if (progress >= 100) {
      progress = 100;
      clearInterval(interval);
      progressBar.style.width = "100%";
      statusText.innerText = "System Ready.";
      // After "System Ready" sits for a moment, send the player to the Night 1 start screen.
      setTimeout(() => {
        window.location.href = "night1.html";
      }, 1500);
    } else {
      progressBar.style.width = progress + "%";

      const nextIndex = Math.floor(progress / 20);
      if (nextIndex > messageIndex && nextIndex < loadingMessages.length) {
        messageIndex = nextIndex;
        statusText.innerText = loadingMessages[messageIndex];
      }
    }
  }, 1000); 
});
</script>

</body>
</html>
