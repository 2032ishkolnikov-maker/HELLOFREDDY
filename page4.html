<!DOCTYPE html>
<html>
<head>
  <title>Night Check 4</title>

  <style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: radial-gradient(ellipse at center, #1a0500 0%, #000 100%);
  color: #ff8866;
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
  user-select: none;
}

/* Faint red scanlines for the creepy security-camera feel */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255, 0, 0, 0.04),
    rgba(255, 0, 0, 0.04) 2px,
    transparent 2px,
    transparent 4px
  );
  pointer-events: none;
  z-index: 100;
}

#static {
  position: fixed;
  inset: 0;
  background: url("https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif");
  background-size: cover;
  opacity: 0.12;
  mix-blend-mode: screen;
}

#questionBox {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10;
  width: 90%;
  max-width: 500px;
}

#questionBox h2 {
  font-family: 'Creepster', cursive;
  font-size: clamp(1.6rem, 4.5vw, 3rem);
  color: #ff2200;
  text-shadow: 0 0 20px #ff0000, 0 0 50px #aa0000;
  letter-spacing: 3px;
  margin-bottom: 30px;
  animation: questionFlicker 4s infinite;
}
@keyframes questionFlicker {
  0%, 100% { opacity: 1; }
  3% { opacity: 0.5; }
  5% { opacity: 1; }
  50% { opacity: 0.88; }
}

button {
  display: block;
  margin: 12px auto;
  padding: 14px 20px;
  width: 260px;
  background: rgba(20, 0, 0, 0.65);
  color: #ff8866;
  border: 2px solid #aa1100;
  border-radius: 6px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 16px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.18s;
  text-transform: uppercase;
  box-shadow: 0 0 10px rgba(170, 17, 0, 0.4) inset;
}
button:hover {
  background: #ff2200;
  color: #fff;
  border-color: #ff4400;
  box-shadow: 0 0 25px #ff2200;
  transform: scale(1.05);
}

#jumpscare {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: black;
  z-index: 9999;
}

#scareImg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: shake 0.03s infinite;
}

@keyframes shake {
  0%   { transform: translate(0,0); }
  25%  { transform: translate(10px,-10px); }
  50%  { transform: translate(-10px,10px); }
  75%  { transform: translate(10px,10px); }
  100% { transform: translate(0,0); }
}

#deathText {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ff0000;
  font-family: 'Creepster', cursive;
  font-size: clamp(3rem, 10vw, 7rem);
  font-weight: bold;
  z-index: 10000;
  display: none;
  letter-spacing: 6px;
  text-shadow: 0 0 30px #ff0000, 0 0 60px #aa0000, 0 0 80px #ff0000;
  animation: blink 0.4s infinite;
}

@keyframes blink {
  0%   { opacity: 1; }
  50%  { opacity: 0.2; }
  100% { opacity: 1; }
}

.drip {
  position: absolute;
  width: 2px;
  height: 22px;
  background: #ff2200;
  opacity: 0.18;
  box-shadow: 0 0 4px #ff0000;
  animation: drip linear infinite;
}

@keyframes drip {
  0%   { transform: translateY(-22px); }
  100% { transform: translateY(100vh); }
}

#whisper {
  position: fixed;
  bottom: 24px;
  width: 100%;
  text-align: center;
  color: #ff4400;
  font-family: 'Creepster', cursive;
  font-size: 18px;
  letter-spacing: 3px;
  text-shadow: 0 0 10px #ff0000;
  opacity: 0.45;
}

#restartBtn {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 32px;
  background: #1a0000;
  color: #ff4444;
  border: 2px solid #ff2200;
  border-radius: 6px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 18px;
  letter-spacing: 3px;
  cursor: pointer;
  display: none;
  z-index: 10001;
  box-shadow: 0 0 20px #ff220088;
}
#restartBtn:hover {
  background: #ff2200;
  color: black;
  box-shadow: 0 0 30px #ff2200;
  transform: translateX(-50%) scale(1.05);
}
</style>
</head>

<body>

<div id="static"></div>

<div id="questionBox">
  <h2>What runs out as you use the doors and lights?</h2>

  <button onclick="answer(0)" id="a0"></button>
  <button onclick="answer(1)" id="a1"></button>
  <button onclick="answer(2)" id="a2"></button>
  <button onclick="answer(3)" id="a3"></button>
</div>

<div id="whisper"></div>

<div id="jumpscare">
  <img id="scareImg" src="freddy.png">
</div>

<div id="deathText">YOU DIED</div>

<!-- Restart button — appears 1.5s after the jumpscare -->
<button id="restartBtn" onclick="window.location.href='index.html'">RESTART</button>

<audio id="ambience" src="creepy.mp3" loop></audio>
<audio id="dripSound" src="drip.mp3" loop></audio>
<audio id="scream" src="scream.mp3"></audio>

<script>
const answers = ["Power", "Time", "Air", "Food"];
const correctAnswer = "Power";

// shuffle answers
answers.sort(() => Math.random() - 0.5);

answers.forEach((a, i) => {
  document.getElementById("a"+i).innerText = a;
});

const ambience = document.getElementById("ambience");
const dripSound = document.getElementById("dripSound");

window.onload = () => {
  ambience.volume = 0.3;
  dripSound.volume = 0.2;

  ambience.play().catch(()=>{});
  dripSound.play().catch(()=>{});

  startDrips();
  startWhispers();
};

function startDrips() {
  for (let i = 0; i < 40; i++) {
    const d = document.createElement("div");
    d.className = "drip";
    d.style.left = Math.random() * 100 + "vw";
    d.style.animationDuration = (Math.random()*2+1)+"s";
    document.body.appendChild(d);
  }
}

const whispers = [
  "watch the meter",
  "keep the lights low",
  "doors drain it fast",
  "do not waste it"
];

function startWhispers() {
  setInterval(() => {
    document.getElementById("whisper").innerText =
      whispers[Math.floor(Math.random()*whispers.length)];
  }, 2000);
}

function answer(index) {
  const chosen = answers[index];

  if (chosen === correctAnswer) {
    window.location.href = "page5.html";
    return;
  }

  triggerJumpscare();
}

function triggerJumpscare() {
  document.getElementById("questionBox").style.display = "none";
  if (document.getElementById("whisper")) {
    document.getElementById("whisper").style.display = "none";
  }

  // Run the shared scary jumpscare first (1.1s of face + scream + flashes + shake).
  // When it fades, show the YOU DIED text and the RESTART button.
  window.runJumpscare(() => {
    document.getElementById("deathText").style.display = "block";
    setTimeout(() => {
      document.getElementById("restartBtn").style.display = "block";
    }, 400);
  });
}
</script>

<script src="music.js"></script>
<script src="jumpscare.js"></script>
</body>
</html>
