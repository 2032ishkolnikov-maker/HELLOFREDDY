<!DOCTYPE html>
<html>
<head>
  <title>Night Check 3</title>

  <style>
    html, body {
      margin: 0;
      background: black;
      height: 100%;
      overflow: hidden;
      color: white;
      font-family: monospace;
    }

    #static {
      position: fixed;
      inset: 0;
      background: url("https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif");
      background-size: cover;
      opacity: 0.15;
      mix-blend-mode: screen;
    }

    #questionBox {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }

    button {
      display: block;
      margin: 8px auto;
      padding: 12px;
      width: 220px;
      background: black;
      color: white;
      border: 1px solid white;
      cursor: pointer;
    }

    button:hover {
      background: white;
      color: black;
    }

    #jumpscare {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: black;
      z-index: 9999;
    }

    #scareImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: shake 0.03s infinite;
    }

    @keyframes shake {
      0% { transform: translate(0,0); }
      25% { transform: translate(10px,-10px); }
      50% { transform: translate(-10px,10px); }
      75% { transform: translate(10px,10px); }
      100% { transform: translate(0,0); }
    }

    #deathText {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: red;
      font-size: 80px;
      font-weight: bold;
      z-index: 10000;
      display: none;
      text-shadow: 0 0 20px red, 0 0 40px red;
      animation: blink 0.4s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .drip {
      position: absolute;
      width: 2px;
      height: 20px;
      background: white;
      opacity: 0.15;
      animation: drip linear infinite;
    }

    @keyframes drip {
      0% { transform: translateY(-20px); }
      100% { transform: translateY(100vh); }
    }

    #whisper {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      opacity: 0.2;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="static"></div>

<div id="questionBox">
  <h2>Which animatronic appears in the backstage area?</h2>

  <button onclick="answer(0)" id="a0"></button>
  <button onclick="answer(1)" id="a1"></button>
  <button onclick="answer(2)" id="a2"></button>
  <button onclick="answer(3)" id="a3"></button>
</div>

<div id="whisper"></div>

<div id="jumpscare">
  <img id="scareImg" src="freddy.png">
</div>

<div id="deathText">YOU DIED</div>

<audio id="ambience" src="creepy.mp3" loop></audio>
<audio id="dripSound" src="drip.mp3" loop></audio>
<audio id="scream" src="scream.mp3"></audio>

<script>
const answers = ["Bonnie", "Freddy", "Chica", "Foxy"];
const correctAnswer = "Bonnie";

// shuffle answers
answers.sort(() => Math.random() - 0.5);

answers.forEach((a, i) => {
  document.getElementById("a"+i).innerText = a;
});

const ambience = document.getElementById("ambience");
const dripSound = document.getElementById("dripSound");

window.onload = () => {
  ambience.volume = 0.3;
  dripSound.volume = 0.2;

  ambience.play().catch(()=>{});
  dripSound.play().catch(()=>{});

  startDrips();
  startWhispers();
};

// 💧 drip effect
function startDrips() {
  for (let i = 0; i < 40; i++) {
    const d = document.createElement("div");
    d.className = "drip";
    d.style.left = Math.random() * 100 + "vw";
    d.style.animationDuration = (Math.random()*2+1)+"s";
    document.body.appendChild(d);
  }
}

// 👁 whisper system
const whispers = [
  "they moved again",
  "backstage is not empty",
  "something is staring",
  "you shouldn't be here"
];

function startWhispers() {
  setInterval(() => {
    document.getElementById("whisper").innerText =
      whispers[Math.floor(Math.random()*whispers.length)];
  }, 2000);
}

// 🎯 answer logic
function answer(index) {
  const chosen = answers[index];

  if (chosen === correctAnswer) {
    // 👉 change this if you add more pages
    window.location.href = "page6.html";
    return;
  }

  triggerJumpscare();
}

// 💀 jumpscare
function triggerJumpscare() {
  document.getElementById("questionBox").style.display = "none";
  document.getElementById("whisper").style.display = "none";

  document.getElementById("jumpscare").style.display = "flex";
  document.getElementById("deathText").style.display = "block";

  const scream = document.getElementById("scream");
  scream.currentTime = 0;
  scream.play().catch(()=>{});
}
</script>

</body>
</html>
