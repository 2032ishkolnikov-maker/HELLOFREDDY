<!DOCTYPE html>
<html>
<head>
  <title>Night Question</title>

  <style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: radial-gradient(ellipse at center, #1a0500 0%, #000 100%);
  color: #ff8866;
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
  user-select: none;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255, 0, 0, 0.04),
    rgba(255, 0, 0, 0.04) 2px,
    transparent 2px,
    transparent 4px
  );
  pointer-events: none;
  z-index: 100;
}

#questionBox {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10;
  width: 90%;
  max-width: 500px;
}

#questionBox h2 {
  font-family: 'Creepster', cursive;
  font-size: clamp(1.6rem, 4.5vw, 3rem);
  color: #ff2200;
  text-shadow: 0 0 20px #ff0000, 0 0 50px #aa0000;
  letter-spacing: 3px;
  margin-bottom: 30px;
  animation: questionFlicker 4s infinite;
}
@keyframes questionFlicker {
  0%, 100% { opacity: 1; }
  3% { opacity: 0.5; }
  5% { opacity: 1; }
  50% { opacity: 0.88; }
}

button {
  display: block;
  margin: 12px auto;
  padding: 14px 20px;
  width: 260px;
  background: rgba(20, 0, 0, 0.65);
  color: #ff8866;
  border: 2px solid #aa1100;
  border-radius: 6px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 16px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.18s;
  text-transform: uppercase;
  box-shadow: 0 0 10px rgba(170, 17, 0, 0.4) inset;
}
button:hover {
  background: #ff2200;
  color: #fff;
  border-color: #ff4400;
  box-shadow: 0 0 25px #ff2200;
  transform: scale(1.05);
}

#timer {
  position: fixed;
  top: 24px;
  right: 30px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 36px;
  font-weight: bold;
  color: #ff2200;
  text-shadow: 0 0 15px #ff0000, 0 0 30px #aa0000;
  letter-spacing: 4px;
  z-index: 50;
}

#jumpscare {
  position: fixed;
  inset: 0;
  display: none;
  background: black;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#jumpscare img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#deathText {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ff0000;
  font-family: 'Creepster', cursive;
  font-size: clamp(3rem, 10vw, 7rem);
  display: none;
  z-index: 10000;
  letter-spacing: 6px;
  text-shadow: 0 0 30px #ff0000, 0 0 60px #aa0000, 0 0 80px #ff0000;
  animation: blink 0.4s infinite;
}

@keyframes blink {
  50% { opacity: 0.2; }
}

#restartBtn {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 32px;
  background: #1a0000;
  color: #ff4444;
  border: 2px solid #ff2200;
  border-radius: 6px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 18px;
  letter-spacing: 3px;
  cursor: pointer;
  display: none;
  z-index: 10001;
  box-shadow: 0 0 20px #ff220088;
}
#restartBtn:hover {
  background: #ff2200;
  color: black;
  box-shadow: 0 0 30px #ff2200;
  transform: translateX(-50%) scale(1.05);
}
</style>
</head>

<body>

<div id="timer">1:00</div>

<div id="questionBox">
  <h2>Which animatronic is disabled by closing the door?</h2>

  <button onclick="answer(0)" id="a0"></button>
  <button onclick="answer(1)" id="a1"></button>
  <button onclick="answer(2)" id="a2"></button>
  <button onclick="answer(3)" id="a3"></button>
</div>

<div id="jumpscare">
  <img src="freddy.png">
</div>

<div id="deathText">YOU DIED</div>

<!-- Restart button — appears 1.5s after the jumpscare -->
<button id="restartBtn" onclick="window.location.href='index.html'">RESTART</button>

<audio id="scream" src="scream.mp3"></audio>

<script>
// answers
const answers = ["Bonnie", "Chica", "Freddy", "Foxy"];
const correctAnswer = "Bonnie"; // left door mechanic

// shuffle
answers.sort(() => Math.random() - 0.5);

answers.forEach((a, i) => {
  document.getElementById("a"+i).innerText = a;
});

// timer
let timeLeft = 60;
let timerInterval;

function startTimer() {
  const timerEl = document.getElementById("timer");

  timerInterval = setInterval(() => {
    timeLeft--;

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    timerEl.innerText =
      minutes + ":" + (seconds < 10 ? "0" + seconds : seconds);

    if (timeLeft <= 10) {
      timerEl.style.color = "white";
      timerEl.style.fontSize = "40px";
    }

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      triggerJumpscare();
    }

  }, 1000);
}

// answer logic
function answer(index) {
  clearInterval(timerInterval);

  const chosen = answers[index];

  if (chosen === correctAnswer) {
    window.location.href = "win.html";
    return;
  }

  triggerJumpscare();
}

// jumpscare
function triggerJumpscare() {
  document.getElementById("questionBox").style.display = "none";

  // Run the shared scary jumpscare first, then show YOU DIED + RESTART button.
  window.runJumpscare(() => {
    document.getElementById("deathText").style.display = "block";
    setTimeout(() => {
      document.getElementById("restartBtn").style.display = "block";
    }, 400);
  });
}

window.onload = startTimer;
</script>

<script src="music.js"></script>

<script src="jumpscare.js"></script>
</body>
</html>
