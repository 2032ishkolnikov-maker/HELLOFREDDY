<!DOCTYPE html>
<html>
<head>
  <title>Night Question</title>

  <style>
    html, body {
      margin: 0;
      background: black;
      height: 100%;
      overflow: hidden;
      color: white;
      font-family: monospace;
    }

    #questionBox {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    button {
      display: block;
      margin: 10px auto;
      padding: 12px;
      width: 220px;
      background: black;
      color: white;
      border: 1px solid white;
      cursor: pointer;
    }

    button:hover {
      background: white;
      color: black;
    }

    #timer {
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 32px;
      color: red;
    }

    #jumpscare {
      position: fixed;
      inset: 0;
      display: none;
      background: black;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #jumpscare img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #deathText {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: red;
      font-size: 80px;
      display: none;
      z-index: 10000;
      animation: blink 0.4s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.2; }
    }

    #restartBtn {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 32px;
      background: #1a0000;
      color: #ff4444;
      border: 2px solid #ff2200;
      border-radius: 6px;
      font-family: monospace;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      display: none;
      z-index: 10001;
      box-shadow: 0 0 20px #ff220088;
    }
    #restartBtn:hover {
      background: #ff2200;
      color: black;
      box-shadow: 0 0 30px #ff2200;
    }
  </style>
</head>

<body>

<div id="timer">1:00</div>

<div id="questionBox">
  <h2>Which animatronic is disabled by closing the door?</h2>

  <button onclick="answer(0)" id="a0"></button>
  <button onclick="answer(1)" id="a1"></button>
  <button onclick="answer(2)" id="a2"></button>
  <button onclick="answer(3)" id="a3"></button>
</div>

<div id="jumpscare">
  <img src="freddy.png">
</div>

<div id="deathText">YOU DIED</div>

<!-- Restart button — appears 1.5s after the jumpscare -->
<button id="restartBtn" onclick="window.location.href='index.html'">RESTART</button>

<audio id="scream" src="scream.mp3"></audio>

<script>
// answers
const answers = ["Bonnie", "Chica", "Freddy", "Foxy"];
const correctAnswer = "Bonnie"; // left door mechanic

// shuffle
answers.sort(() => Math.random() - 0.5);

answers.forEach((a, i) => {
  document.getElementById("a"+i).innerText = a;
});

// timer
let timeLeft = 60;
let timerInterval;

function startTimer() {
  const timerEl = document.getElementById("timer");

  timerInterval = setInterval(() => {
    timeLeft--;

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    timerEl.innerText =
      minutes + ":" + (seconds < 10 ? "0" + seconds : seconds);

    if (timeLeft <= 10) {
      timerEl.style.color = "white";
      timerEl.style.fontSize = "40px";
    }

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      triggerJumpscare();
    }

  }, 1000);
}

// answer logic
function answer(index) {
  clearInterval(timerInterval);

  const chosen = answers[index];

  if (chosen === correctAnswer) {
    window.location.href = "win.html";
    return;
  }

  triggerJumpscare();
}

// jumpscare
function triggerJumpscare() {
  document.getElementById("questionBox").style.display = "none";
  document.getElementById("jumpscare").style.display = "flex";
  document.getElementById("deathText").style.display = "block";

  document.getElementById("scream").play().catch(()=>{});

  // Show the RESTART button after 1.5 seconds so the jumpscare hits first
  setTimeout(() => {
    document.getElementById("restartBtn").style.display = "block";
  }, 1500);
}

window.onload = startTimer;
</script>

<script src="music.js"></script>

</body>
</html>
